services:
  - type: web
    name: lithia-wallet-scorecards
    runtime: node
    region: virginia
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SUPABASE_URL
        value: https://ropvfkjkpcqiwgqfmzfz.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://lithia-wallet-scorecards.onrender.com
      - key: APPLE_TEAM_ID
        value: A63L38TNCC
      - key: APPLE_PASS_TYPE_ID
        value: pass.com.alphadriveai.lithia.scorecard
      - key: APPLE_PASS_P12_PATH
        value: /etc/secrets/lithia-scorecard.p12
      - key: APPLE_PASS_P12_PASSWORD
        sync: false
      - key: APPLE_APNS_KEY_PATH
        value: /etc/secrets/AuthKey_3BH6593MS4.p8
      - key: APPLE_APNS_KEY_ID
        value: 3BH6593MS4
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: NOTIFY_ON_CHANGE
        value: "false"
